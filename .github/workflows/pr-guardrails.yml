name: pr-guardrails

# Runs on every pull request, with no path filters, so the rulesets can
# require one check that always reports: "pr-guardrails / required".

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan this pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --no-banner --redact --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  jira-key:
    name: jira-key
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title starts with a WO or SOC key
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(WO|SOC)-[0-9]+: '
          if [[ "$PR_TITLE" =~ $re ]]; then
            echo "Title has a Jira key: ${BASH_REMATCH[0]}"
          else
            echo "::error::Start the PR title with its Jira key, e.g. \"WO-123: Short summary\"."
            exit 1
          fi

  required:
    name: pr-guardrails / required
    needs: [gitleaks, jira-key]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Both guardrails passed
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          JIRA_KEY_RESULT: ${{ needs.jira-key.result }}
        run: |
          echo "gitleaks: $GITLEAKS_RESULT, jira-key: $JIRA_KEY_RESULT"
          [ "$GITLEAKS_RESULT" = success ] && [ "$JIRA_KEY_RESULT" = success ]
